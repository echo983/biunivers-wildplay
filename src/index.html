<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>WildPlay</title>
  </head>
  <body>
    <main class="player-shell">
      <section class="stage" aria-label="视频画面">
        <canvas id="video-canvas"></canvas>
        <div id="empty-state" class="empty-state">
          <strong>WildPlay</strong>
          <span>打开一个 MP4、WebM 或 MKV 文件</span>
          <button id="open-file" type="button">打开媒体</button>
        </div>
      </section>

      <section class="controls" aria-label="播放控制">
        <button id="play-pause" type="button" disabled>播放</button>
        <input
          id="timeline"
          type="range"
          min="0"
          max="1"
          value="0"
          step="0.001"
          aria-label="播放进度"
          disabled
        />
        <span id="time">00:00 / 00:00</span>
        <button id="mute" type="button" disabled>静音</button>
        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          value="1"
          step="0.05"
          aria-label="音量"
          disabled
        />
        <button id="fullscreen" type="button">全屏</button>
      </section>

      <footer class="status-bar">
        <span id="filename">未打开媒体</span>
        <span id="media-info"></span>
        <span id="status" role="status">正在连接 Biunivers…</span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
